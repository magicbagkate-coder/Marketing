services:
  app:
    build: .
    container_name: magicbag-news
    restart: unless-stopped
    env_file: .env
    ports:
      - "7000:7000"
    volumes:
      # knowledge base (course texts, audience portrait, checklists, library of winning reels): private, never in git; writable so that winners:build can add the library
      - ./knowledge:/app/knowledge
      # the latest digest, so the assistant can use today's trends
      - ./state:/app/state
